// Множитель ROI: какую месячную ценность ожидаем относительно стоимости системы
// (k = во сколько раз ROI больше затрат при типичном бюджете medium)
const IDEA_ROI_MULTIPLIER = {
  delegate: 8, online: 6, invest: 5, realty: 4, product: 5, brand: 5,
  offline: 4, franchise: 6, international: 7, tech: 6, production: 4,
  content: 4, education: 4, social: 2,

// База месячной ценности в зависимости от бюджета (вложения = масштаб ожиданий)
const BUDGET_SCALE = {
  starter: 0.5, small: 1, medium: 2.5, large: 8, unlimited: 15, __auto__: 2.5,
};

function calculateMetrics(selections) {
  const baseCost = (selections.hardware && selections.hardware !== '__auto__' && HARDWARE_COST[selections.hardware])
    ? HARDWARE_COST[selections.hardware] : 299;

  let agentsCount = 0;
  let agentCost = 0;
  const perAgent = 79;
  const autoTeamCost = 999;

  if (selections.agents[0] === '__auto__') {
    agentsCount = 10;
    agentCost = autoTeamCost;
  } else if (selections.agents.length > 0) {
    agentsCount = selections.agents.length;
    agentCost = agentsCount * perAgent;
  } else if (selections.departments.length > 0 && selections.departments[0] !== '__auto__') {
    const derived = new Set();
    selections.departments.forEach((depId) => {
      const dep = DEPARTMENT_OPTIONS.find((d) => d.id === depId);
      if (dep) dep.agents.forEach((a) => derived.add(a));
    });
    agentsCount = derived.size;
    agentCost = agentsCount * perAgent;
  }

  const cost = baseCost + agentCost;

  let firstDays = null;
  let goalMonths = null;
  if (selections.idea && selections.idea !== '__auto__' && selections.idea !== 'custom' && IDEA_TIME[selections.idea]) {
    firstDays = IDEA_TIME[selections.idea].first;
    goalMonths = IDEA_TIME[selections.idea].goal;
    if (selections.goals.length > 1 && selections.goals[0] !== '__auto__') {
      goalMonths = Math.round(goalMonths * (1 + (selections.goals.length - 1) * 0.15));
    }
  } else if (selections.idea === '__auto__') {
    firstDays = 14;
    goalMonths = 9;
  }

  // Расчёт ROI: ожидаемая месячная ценность (доход или экономия)
  let monthlyValue = null;
  const ideaKey = selections.idea && selections.idea !== '__auto__' && selections.idea !== 'custom' ? selections.idea : null;
  const budgetKey = (selections.self && selections.self.budget) || null;
  if (ideaKey && IDEA_ROI_MULTIPLIER[ideaKey]) {
    const multiplier = IDEA_ROI_MULTIPLIER[ideaKey];
    const scale = (budgetKey && BUDGET_SCALE[budgetKey]) || 1;
    // Базовая ценность = cost × multiplier × budget scale
    monthlyValue = Math.round(cost * multiplier * scale);
  } else if (selections.idea === '__auto__') {
    const scale = (budgetKey && BUDGET_SCALE[budgetKey]) || 1;
    monthlyValue = Math.round(cost * 5 * scale);
  }

  return { cost, agentsCount, firstDays, goalMonths, monthlyValue };
}

function formatFirstResult(days) {
  if (days === null) return '—';
  if (days <= 7) return `${days} дней`;
  if (days <= 30) return `~${Math.round(days / 7)} нед.`;
  return `~${Math.round(days / 30)} мес.`;
}
function formatGoalTime(months) {
  if (months === null) return '—';
  if (months <= 3) return `${months} мес.`;
  return `${months}-${months + Math.round(months * 0.3)} мес.`;
}
function pluralAgents(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'агент';
  if ([2, 3, 4].includes(m10) && ![12, 13, 14].includes(m100)) return 'агента';
  return 'агентов';
}

const INITIAL_SELECTIONS = {
  self: { age: null, status: null, family: null, geo: null, budget: null },
  mission: null, missionCustom: '',
  idea: null, ideaCustom: '',
  goals: [], goalsCustoms: [],
  hardware: null, hardwareCustom: '',
  departments: [], departmentsCustoms: [],
  agents: [], agentsCustoms: [],
  connection: { autonomy: null, reporting: [], channel: [], style: null },
};

function AliveConstructor() {
  const [view, setView] = useState('dashboard');
  const [helpOpen, setHelpOpen] = useState(null);
  const [metricInfoOpen, setMetricInfoOpen] = useState(null);
  const [submissionOpen, setSubmissionOpen] = useState(false);
  const [howItWorksOpen, setHowItWorksOpen] = useState(false);
  const [easyOpen, setEasyOpen] = useState(false);
  const [easyText, setEasyText] = useState('');
  const [easySent, setEasySent] = useState(false);
  const [showCustom, setShowCustom] = useState({});
  const [selections, setSelections] = useState(INITIAL_SELECTIONS);
  const [modes, setModes] = useState({
    manual: true, ai: false,
  });

  useEffect(() => {
    if (document.getElementById('alive-fonts')) return;
    const link = document.createElement('link');
    link.id = 'alive-fonts';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap';
    document.head.appendChild(link);
  }, []);

  useEffect(() => {
    // Favicon — буква A в фирменном минимализме Alive
    const existing = document.querySelector("link[rel='icon']");
    if (existing) existing.remove();
    const link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.href = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23A833B9'/><text x='16' y='23' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, Helvetica, sans-serif' font-size='22' font-weight='700' fill='%23ffffff'>A</text></svg>";
    document.head.appendChild(link);
  }, []);

  useEffect(() => {
    if (view === 'departments' && selections.departments.length === 0 && selections.idea && IDEA_TO_DEPARTMENTS[selections.idea]) {
      setSelections((s) => ({ ...s, departments: [...IDEA_TO_DEPARTMENTS[s.idea]] }));
    }
    if (view === 'agents' && selections.agents.length === 0 && selections.idea && IDEA_TO_AGENTS[selections.idea]) {
      setSelections((s) => ({ ...s, agents: [...IDEA_TO_AGENTS[s.idea]] }));
    }
    // eslint-disable-next-line
  }, [view]);

  const isSelected = (key) => {
    const sec = SECTIONS[key];
    if (sec.type === 'compound') {
      const obj = selections[key];
      return sec.subsections.every((sub) => sub.multi ? (obj[sub.key] || []).length > 0 : !!obj[sub.key]);
    }
    if (sec.type === 'multi') {
      const customs = selections[`${key}Customs`] || [];
      return selections[key].length > 0 || customs.length > 0;
    }
    return !!selections[key];
  };
  const completedCount = ALL_KEYS.filter(isSelected).length;
  const allComplete = completedCount === ALL_KEYS.length;
  const telosCompleted = TELOS_KEYS.filter(isSelected).length;
  const officeCompleted = OFFICE_KEYS.filter(isSelected).length;

  const summaryFor = (key) => {
    const sec = SECTIONS[key];
    if (sec.type === 'compound') {
      if (!isSelected(key)) return null;
      const obj = selections[key];
      const parts = sec.subsections.map((sub) => {
        const v = obj[sub.key];
        if (sub.multi) {
          if (!v || !v.length) return null;
          if (v[0] === '__auto__') return 'Alive';
          return v.map((id) => sub.options.find((o) => o.id === id)?.label).filter(Boolean).join(' + ');
        }
        if (v === '__auto__') return 'Alive';
        return sub.options.find((o) => o.id === v)?.label;
      }).filter(Boolean);
      return parts.join(' · ');
    }
    const single = (opts, val, customVal) => {
      if (val === '__auto__') return 'Alive выбирает';
      if (val === 'custom') return customVal || 'Свой вариант';
      return opts.find((o) => o.id === val)?.label || null;
    };
    if (sec.type === 'single') {
      return single(sec.options, selections[key], selections[`${key}Custom`]);
    }
    // multi
    if (selections[key][0] === '__auto__') return 'Alive подбирает сама';
    const standardLabels = selections[key].map((id) => sec.options.find((o) => o.id === id)?.label).filter(Boolean);
    const customLabels = selections[`${key}Customs`] || [];
    const all = [...standardLabels, ...customLabels];
    return all.length ? all.join(' · ') : null;
  };

  const applyScenario = (scenario) => {
    setSelections({
      self: { ...scenario.selections.self },
      mission: scenario.selections.mission, missionCustom: '',
      idea: scenario.selections.idea, ideaCustom: '',
      goals: [...scenario.selections.goals], goalsCustoms: [],
      hardware: scenario.selections.hardware, hardwareCustom: '',
      departments: [...scenario.selections.departments], departmentsCustoms: [],
      agents: [...scenario.selections.agents], agentsCustoms: [],
      connection: { ...scenario.selections.connection },
    });
    setModes({ manual: true, ai: false });
  };

  const resetAll = () => {
    setSelections(INITIAL_SELECTIONS);
    setShowCustom({});
    setEasyText('');
    setEasySent(false);
    setView('dashboard');
    setModes({ manual: true, ai: false });
  };

  const metrics = useMemo(() => calculateMetrics(selections), [selections]);

  return (
    <div className="alive-root">
      <style>{styles}</style>

      <div className="alive-shell">
        <header className="alive-header">
          <div className="brand">
            <span className="brand-name">Alive.</span>
          </div>
          <div className="header-actions">
            <button onClick={() => setHowItWorksOpen(true)} className="header-btn">
              <BookOpen size={14} /><span>Как это работает</span>
            </button>
            <button onClick={resetAll} className="header-btn">
              <RotateCcw size={14} /><span>Сбросить</span>
            </button>
          </div>
        </header>

        {view === 'dashboard' && (
          <Dashboard
            isSelected={isSelected} summaryFor={summaryFor}
            setView={setView} setHelpOpen={setHelpOpen}
            setMetricInfoOpen={setMetricInfoOpen}
            setSubmissionOpen={setSubmissionOpen}
            setEasyOpen={setEasyOpen} easySent={easySent}
            applyScenario={applyScenario}
            metrics={metrics} selections={selections}
            modes={modes} setModes={setModes}
            completedCount={completedCount} allComplete={allComplete}
            telosCompleted={telosCompleted} officeCompleted={officeCompleted}
          />
        )}

        {view !== 'dashboard' && (
          <SelectionView
            sectionKey={view}
            selections={selections} setSelections={setSelections}
            showCustom={showCustom} setShowCustom={setShowCustom}
            onBack={() => setView('dashboard')}
            onOpenHelp={() => setHelpOpen(view)}
          />
        )}

        {view === 'dashboard' && (
          <>
            <div className="trust-strip">
              <span className="trust-strip-label">Среди наших клиентов</span>
              <div className="trust-strip-logos">
                <span className="trust-strip-logo">Cimo Group</span>
                <span className="trust-strip-dot">·</span>
                <span className="trust-strip-logo">2Leads Agency</span>
              </div>
            </div>

            <AliveAnimation />

            <FaqBlock />
          </>
        )}

        <footer className="alive-footer">
          <a
            href="https://t.me/Vladimir_Pop"
            target="_blank"
            rel="noopener noreferrer"
            className="footer-link footer-link-brand"
          >
            <Send size={14} />
            <span>Связаться</span>
          </a>
          <a
            href="https://cimo-ai.site/#alive"
            target="_blank"
            rel="noopener noreferrer"
            className="footer-textlink"
          >
            <span>Подробнее об Alive</span>
            <ArrowUpRight size={12} />
          </a>
        </footer>

        {helpOpen && <HelpModal sectionKey={helpOpen} onClose={() => setHelpOpen(null)} />}
        {metricInfoOpen && <MetricInfoModal info={METRIC_INFO[metricInfoOpen]} onClose={() => setMetricInfoOpen(null)} />}
        {howItWorksOpen && <HowItWorksModal onClose={() => setHowItWorksOpen(false)} />}
        {submissionOpen && (
          <SubmissionModal
            selections={selections}
            summaryFor={summaryFor}
            metrics={metrics}
            onClose={() => setSubmissionOpen(false)}
          />
        )}

        {easyOpen && (
          <EasyModeModal
            text={easyText} setText={setEasyText} sent={easySent}
            onSubmit={() => {
              setEasySent(true);
              setSelections({
                self: { age: '__auto__', status: '__auto__', family: '__auto__', geo: '__auto__', budget: '__auto__' },
                mission: '__auto__', missionCustom: '',
                idea: '__auto__', ideaCustom: '',
                goals: ['__auto__'], goalsCustoms: [],
                hardware: '__auto__', hardwareCustom: '',
                departments: ['__auto__'], departmentsCustoms: [],
                agents: ['__auto__'], agentsCustoms: [],
                connection: { autonomy: '__auto__', reporting: ['__auto__'], channel: ['__auto__'], style: '__auto__' },
              });
            }}
            onClose={() => setEasyOpen(false)}
          />
        )}
      </div>
    </div>
  );
}

        onToggle={() => setModes((m) => ({ ...m, ai: !m.ai }))}
      >
        <InnerSection
          title="Готовые сценарии"
          subline="Применить готовый пресет — заполнит все разделы сразу"
        >
          <div className="scenarios-row">
            {EXAMPLE_SCENARIOS.map((sc) => (
              <button key={sc.id} className="scenario-card" onClick={() => applyScenario(sc)}>
                <div className="scenario-icon"><Glyph name={sc.icon} size={22} /></div>
                <div className="scenario-title">{sc.title}</div>
                <div className="scenario-desc">{sc.description}</div>
                <div className="scenario-cta">Применить →</div>
              </button>
            ))}
          </div>
        </InnerSection>

        <button className={`easy-banner ${easySent ? 'sent' : ''}`} onClick={() => setEasyOpen(true)}>
          <div className="easy-banner-icon"><Wand2 size={20} /></div>
          <div className="easy-banner-text">
            <div className="easy-banner-title">
              {easySent ? 'Запрос отправлен — Alive подбирает решение' : 'Сделайте всё за меня'}
              <InfoHint text="Если не понимаете, что делать — просто расскажите своими словами, чего хотите. Alive сделает всё остальное" position="top" />
            </div>
            <div className="easy-banner-sub">
              {easySent ? 'Можно дополнить или изменить в любой момент' : 'Не нужно разбираться — расскажите Alive своими словами, чего хотите'}
            </div>
          </div>
          <div className="easy-banner-arrow"><ArrowRight size={18} /></div>
        </button>
      </ModeToggle>
    </main>
  );
}

function SelectionView({ sectionKey, selections, setSelections, showCustom, setShowCustom, onBack, onOpenHelp }) {
  const sec = SECTIONS[sectionKey];
  const [customDraft, setCustomDraft] = useState('');
  const [customInputOpen, setCustomInputOpen] = useState(false);

  useEffect(() => {
    setCustomDraft('');
    setCustomInputOpen(false);
  }, [sectionKey]);

  const getRecommended = () => {
    if (sectionKey === 'idea' && selections.mission && selections.mission !== '__auto__' && selections.mission !== 'custom') {
      return MISSION_TO_IDEA[selections.mission] || [];
    }
    if (sectionKey === 'goals' && selections.idea && selections.idea !== '__auto__' && selections.idea !== 'custom') {
      return IDEA_TO_GOAL[selections.idea] || [];
    }
    if (sectionKey === 'departments' && selections.idea && selections.idea !== '__auto__' && selections.idea !== 'custom') {
      return IDEA_TO_DEPARTMENTS[selections.idea] || [];
    }
    if (sectionKey === 'agents' && selections.idea && selections.idea !== '__auto__' && selections.idea !== 'custom') {
      return IDEA_TO_AGENTS[selections.idea] || [];
    }
    return [];
  };
  const recommended = getRecommended();

  const selectSingle = (key, id) => {
    setSelections((s) => ({ ...s, [key]: id, [`${key}Custom`]: id === 'custom' ? s[`${key}Custom`] : '' }));
    if (id !== 'custom') setShowCustom((s) => ({ ...s, [key]: false }));
  };
  const toggleMulti = (key, id) => {
    setSelections((s) => ({
      ...s,
      [key]: s[key].includes(id) ? s[key].filter((a) => a !== id) : [...s[key].filter((a) => a !== '__auto__'), id],
    }));
  };

  const setCompoundValue = (subKey, multi, id) => {
    setSelections((s) => {
      if (multi) {
        const current = s[sectionKey][subKey];
        const next = current.includes(id) ? current.filter((x) => x !== id) : [...current.filter((x) => x !== '__auto__'), id];
        return { ...s, [sectionKey]: { ...s[sectionKey], [subKey]: next } };
      }
      return { ...s, [sectionKey]: { ...s[sectionKey], [subKey]: id } };
    });
  };

  const trustAlive = () => {
    if (sec.type === 'compound') {
      const allAuto = {};
      sec.subsections.forEach((sub) => { allAuto[sub.key] = sub.multi ? ['__auto__'] : '__auto__'; });
      setSelections((s) => ({ ...s, [sectionKey]: allAuto }));
    } else if (sec.type === 'multi') {
      setSelections((s) => ({ ...s, [sectionKey]: ['__auto__'] }));
    } else {
      setSelections((s) => ({ ...s, [sectionKey]: '__auto__', [`${sectionKey}Custom`]: '' }));
    }
  };

  const addCustom = (text) => {
    const trimmed = text.trim();
    if (!trimmed) return;
    setSelections((s) => {
      const customsKey = `${sectionKey}Customs`;
      const current = s[customsKey] || [];
      if (current.includes(trimmed)) return s;
      // если был __auto__, убираем
      const cleanedMain = s[sectionKey][0] === '__auto__' ? [] : s[sectionKey];
      return { ...s, [sectionKey]: cleanedMain, [customsKey]: [...current, trimmed] };
    });
  };

  const removeCustom = (text) => {
    setSelections((s) => {
      const customsKey = `${sectionKey}Customs`;
      const current = s[customsKey] || [];
      return { ...s, [customsKey]: current.filter((x) => x !== text) };
    });
  };

  return (
    <main className="alive-main fade-in">
      <button className="back-btn" onClick={onBack}>
        <ArrowLeft size={14} /><span>К карте замысла</span>
      </button>

      <div className="sel-head">
        <div className="sel-kicker">Раздел {sec.number}</div>
        <h1 className="sel-title">{sec.title}</h1>
        <p className="sel-subtitle">{sec.brief}</p>
        <button className="learn-more" onClick={onOpenHelp}>
          <Info size={14} /><span>Что это и для чего</span>
        </button>
      </div>

      {sec.type !== 'compound' && (
        <>
          {recommended.length > 0 && (
            <div className="rec-banner">
              <Star size={14} fill="currentColor" />
              <span>Звёздочкой отмечены варианты, которые лучше сочетаются с предыдущим выбором</span>
            </div>
          )}
          {sec.type === 'multi' && (
            <div className="select-hint select-hint-multi">
              <Check size={13} strokeWidth={2.5} />
              <span>Можно выбрать несколько — Alive объединит их в общий план</span>
            </div>
          )}
          {sec.type === 'single' && (
            <div className="select-hint select-hint-single">
              <Info size={13} />
              <span>{SINGLE_HINTS[sectionKey] || 'Выберите один вариант — наиболее подходящий вам сейчас'}</span>
            </div>
          )}

          <div className="options-grid">
            {sec.options.map((opt) => {
              const isSel = sec.type === 'multi'
                ? (selections[sectionKey] || []).includes(opt.id)
                : selections[sectionKey] === opt.id;
              const isRec = recommended.includes(opt.id);
              return (
                <button key={opt.id}
                  onClick={() => sec.type === 'multi' ? toggleMulti(sectionKey, opt.id) : selectSingle(sectionKey, opt.id)}
                  className={`option-card ${isSel ? 'selected' : ''} ${isRec ? 'recommended' : ''}`}>
                  {isRec && !isSel && <div className="rec-badge"><Star size={10} fill="currentColor" /></div>}
                  {isSel && <div className="check-badge"><Check size={12} strokeWidth={3} /></div>}
                  <span className="option-label">{opt.label}</span>
                  <span className="option-tip">{opt.tip}</span>
                </button>
              );
            })}

            {sec.type === 'single' && (
              <button
                onClick={() => { selectSingle(sectionKey, 'custom'); setShowCustom((s) => ({ ...s, [sectionKey]: true })); }}
                className={`option-card option-custom ${selections[sectionKey] === 'custom' ? 'selected' : ''}`}>
                <Edit3 size={16} className="option-icon-accent" />
                <span className="option-label">Свой вариант</span>
                <span className="option-tip">Опишите своими словами — Alive поймёт</span>
              </button>
            )}

            {sec.type === 'multi' && (
              <button
                onClick={() => setCustomInputOpen(true)}
                className={`option-card option-custom ${customInputOpen ? 'is-active' : ''}`}>
                <Edit3 size={16} className="option-icon-accent" />
                <span className="option-label">Добавить свой вариант</span>
                <span className="option-tip">Можно добавить несколько своих пунктов</span>
              </button>
            )}

            <button onClick={trustAlive}
              className={`option-card option-trust ${
                (sec.type === 'multi' && (selections[sectionKey] || [])[0] === '__auto__') ||
                (sec.type === 'single' && selections[sectionKey] === '__auto__') ? 'selected' : ''
              }`}>
              <Sparkles size={16} className="option-icon-accent" />
              <span className="option-label">Доверить Alive</span>
              <span className="option-tip">
                {sec.type === 'multi' ? 'Alive сама подберёт оптимальный состав' : 'Alive предложит вариант сама'}
              </span>
            </button>
          </div>

          {sec.type === 'multi' && customInputOpen && (
            <div className="multi-custom-input-wrap">
              <input
                type="text"
                className="multi-custom-input"
                placeholder={`Например, ${sectionKey === 'goals' ? 'выйти на пассивный доход $15k/мес' : sectionKey === 'departments' ? 'отдел исследований и разработки' : 'агент по работе с госорганами'}`}
                value={customDraft}
                onChange={(e) => setCustomDraft(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && customDraft.trim()) {
                    addCustom(customDraft);
                    setCustomDraft('');
                  }
                  if (e.key === 'Escape') {
                    setCustomInputOpen(false);
                    setCustomDraft('');
                  }
                }}
                autoFocus
              />
              <button
                className="multi-custom-add"
                onClick={() => { addCustom(customDraft); setCustomDraft(''); }}
                disabled={!customDraft.trim()}
              >
                Добавить
              </button>
              <button
                className="multi-custom-cancel"
                onClick={() => { setCustomInputOpen(false); setCustomDraft(''); }}
              >
                <X size={14} />
              </button>
            </div>
          )}

          {sec.type === 'multi' && (selections[`${sectionKey}Customs`] || []).length > 0 && (
            <div className="multi-customs-list">
              <div className="multi-customs-label">Ваши варианты:</div>
              <div className="multi-customs-chips">
                {(selections[`${sectionKey}Customs`] || []).map((text) => (
                  <span key={text} className="multi-custom-chip">
                    <span>{text}</span>
                    <button onClick={() => removeCustom(text)} className="multi-custom-chip-remove">
                      <X size={11} />
                    </button>
                  </span>
                ))}
              </div>
            </div>
          )}

          {sec.type === 'single' && selections[sectionKey] === 'custom' && (
            <div className="custom-input-wrap">
              <textarea
                value={selections[`${sectionKey}Custom`] || ''}
                onChange={(e) => setSelections((s) => ({ ...s, [`${sectionKey}Custom`]: e.target.value }))}
                placeholder={`Опишите ${sec.title.toLowerCase()} своими словами…`}
                className="custom-input" rows={3} autoFocus
              />
            </div>
          )}
        </>
      )}

      {sec.type === 'compound' && (
        <div className="interaction-sections">
          {sec.subsections.map((sub) => (
            <CompoundSection
              key={sub.key} title={sub.title} hint={sub.hint}
              options={sub.options} multi={sub.multi}
              selected={selections[sectionKey][sub.key]}
              onSelect={(id) => setCompoundValue(sub.key, sub.multi, id)}
            />
          ))}
          <button onClick={trustAlive} className="trust-row-btn">
            <Sparkles size={14} /><span>Доверить настройку Alive целиком</span>
          </button>
        </div>
      )}

      <div className="sel-foot">
        <button onClick={onBack} className="cta-secondary">
          <ArrowLeft size={14} /><span>Вернуться к карте</span>
        </button>
      </div>
    </main>
  );
}

function CompoundSection({ title, hint, options, multi, selected, onSelect }) {
  const isSel = (id) => multi ? (selected || []).includes(id) : selected === id;
  return (
    <div className="int-section">
      <div className="int-head">
        <h3 className="int-title">{title}</h3>
        <span className="int-hint">
          {multi ? <Check size={11} strokeWidth={2.5} /> : <Info size={11} />}
          <span>{hint}</span>
        </span>
      </div>
      <div className="int-chips">
        {options.map((opt) => (
          <button key={opt.id} onClick={() => onSelect(opt.id)}
            className={`int-chip ${isSel(opt.id) ? 'selected' : ''}`} title={opt.tip}>
            {multi && isSel(opt.id) && <Check size={11} strokeWidth={3} className="chip-check" />}
            {opt.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function HelpModal({ sectionKey, onClose }) {
  const sec = SECTIONS[sectionKey];
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><X size={16} /></button>
        <div className="modal-kicker">Раздел {sec.number} — справка</div>
        <h2 className="modal-title">{sec.title}</h2>
        <div className="modal-section"><div className="modal-h">Что это</div><p>{sec.info.what}</p></div>
        <div className="modal-section"><div className="modal-h">Для чего</div><p>{sec.info.why}</p></div>
        <div className="modal-section"><div className="modal-h">Как это работает у вас</div><p>{sec.info.how}</p></div>
        <div className="modal-section modal-example"><div className="modal-h">Пример</div><p>{sec.info.example}</p></div>
      </div>
    </div>
  );
}

function MetricInfoModal({ info, onClose }) {
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal modal-metric" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><X size={16} /></button>
        <div className="modal-kicker">Показатель</div>
        <h2 className="modal-title">{info.title}</h2>
        <p className="modal-body">{info.body}</p>
      </div>
    </div>
  );
}

function AliveAnimation() {
  const sceneRef = useRef(null);
  const terminalRef = useRef(null);
  const balanceRef = useRef(null);
  const balancePopupRef = useRef(null);
  const planRef = useRef(null);
  const planFillRef = useRef(null);
  const tasksRef = useRef(null);
  const tasksTickRef = useRef(null);
  const eventTextRef = useRef(null);
  const eventTimeRef = useRef(null);

  const [selectedAgent, setSelectedAgent] = useState(DIGITAL_TWIN);
  const [hoveredAgent, setHoveredAgent] = useState(null);
  const [teamInfoOpen, setTeamInfoOpen] = useState(false);
  const [chatOpen, setChatOpen] = useState(false);
  const [chatMessages, setChatMessages] = useState([]); // {from: 'user'|'agent', text, typing?}
  const [usedQuestions, setUsedQuestions] = useState(new Set());
  const chatBodyRef = useRef(null);

  // При смене агента сбрасываем чат
  useEffect(() => {
    setChatOpen(false);
    setChatMessages([]);
    setUsedQuestions(new Set());
  }, [selectedAgent?.id]);

  // Автоскролл чата вниз
  useEffect(() => {
    if (chatBodyRef.current) {
      chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    }
  }, [chatMessages]);

  const sendQuestion = (qa, idx) => {
    if (usedQuestions.has(idx)) return;
    setUsedQuestions((s) => new Set([...s, idx]));
    setChatMessages((m) => [...m, { from: 'user', text: qa.q }]);
    // Через 600ms показываем typing-индикатор
    setTimeout(() => {
      setChatMessages((m) => [...m, { from: 'agent', typing: true }]);
    }, 600);
    // Через ещё 1200ms — реальный ответ
    setTimeout(() => {
      setChatMessages((m) => {
        const withoutTyping = m.filter((msg) => !msg.typing);
        return [...withoutTyping, { from: 'agent', text: qa.a }];
      });
    }, 1800);
  };

  const resetChat = () => {
    setChatMessages([]);
    setUsedQuestions(new Set());
  };

  // Хелпер: рендерит SVG аватарку агента (включая Digital Twin)
  const renderAvatarSymbol = (agent, size = 16) => {
    if (!agent) return null;
    if (agent.symbol === 'core') {
      const gradId = `av-avatarCore-${agent.id}-${size}`;
      return (
        <svg viewBox="-8 -8 16 16" width={size} height={size}>
          <defs>
            <radialGradient id={gradId} cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stopColor="#ffffff" stopOpacity="1" />
              <stop offset="35%" stopColor="#E91E84" stopOpacity="0.85" />
              <stop offset="100%" stopColor="#6B2FB5" stopOpacity="0" />
            </radialGradient>
          </defs>
          <circle cx={0} cy={0} r={7} fill={`url(#${gradId})`} opacity={0.55} />
          <circle cx={0} cy={0} r={4.5} fill={`url(#${gradId})`} />
          <circle cx={0} cy={0} r={1.3} fill="#ffffff" />
        </svg>
      );
    }
    return (
      <svg viewBox="-8 -8 16 16" width={size} height={size}>
        <circle cx={0} cy={0} r={7} fill="rgba(168, 51, 185, 0.2)" />
        <circle cx={0} cy={0} r={5.5} fill="var(--surface-3)" stroke="rgba(255,255,255,0.2)" strokeWidth={0.5} />
        {agent.symbol === 'dot' && <circle cx={0} cy={0} r={1.5} fill="var(--ink)" />}
        {agent.symbol === 'square' && <rect x={-1.5} y={-1.5} width={3} height={3} fill="var(--ink)" />}
        {agent.symbol === 'triangle' && <polygon points="0,-2 1.8,1.3 -1.8,1.3" fill="var(--ink)" />}
        {agent.symbol === 'plus' && (
          <g fill="var(--ink)">
            <rect x={-0.4} y={-2} width={0.8} height={4} />
            <rect x={-2} y={-0.4} width={4} height={0.8} />
          </g>
        )}
        {agent.symbol === 'diamond' && <polygon points="0,-2 2,0 0,2 -2,0" fill="var(--ink)" />}
      </svg>
    );
  };

  // Какие узлы связаны с hover-агентом — для подсветки связей
  const CROSS_LINKS = [
    ['marketing', 'analyst'], ['finance', 'analyst'], ['strategy', 'finance'],
    ['marketing', 'content'], ['sales', 'legal'], ['assistant', 'strategy'],
  ];
  const connectedAgents = hoveredAgent === 'twin'
    ? new Set(ANIM_AGENTS.map(a => a.id)) // при hover на ядре — все агенты связаны
    : hoveredAgent
      ? new Set(
          CROSS_LINKS
            .filter(([a, b]) => a === hoveredAgent || b === hoveredAgent)
            .map(([a, b]) => (a === hoveredAgent ? b : a))
        )
      : new Set();

  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    const state = { balance: 180, tasksToday: 19, plan: 11 };
    let lastEventIdx = -1;
    let currentEventTime = 0;
    const timers = [];

    function getAgentPos(agent) {
      const rad = (agent.angle * Math.PI) / 180;
      return { x: Math.cos(rad) * agent.r, y: Math.sin(rad) * agent.r };
    }
    function getAgentById(id) { return ANIM_AGENTS.find(a => a.id === id); }

    function renderStats() {
      if (balanceRef.current) balanceRef.current.textContent = `$ ${state.balance.toLocaleString('en-US')}`;
      if (planRef.current) planRef.current.textContent = `${Math.min(99, Math.round(state.plan))}%`;
      if (planFillRef.current) planFillRef.current.style.width = `${Math.min(99, state.plan)}%`;
      if (tasksRef.current) tasksRef.current.textContent = state.tasksToday.toLocaleString('ru-RU');
    }
    renderStats();

    function popBalance(cash) {
      if (!balancePopupRef.current) return;
      balancePopupRef.current.textContent = `+$${cash.toLocaleString('en-US')}`;
      balancePopupRef.current.classList.remove('is-firing');
      void balancePopupRef.current.offsetWidth;
      balancePopupRef.current.classList.add('is-firing');
    }
    function popTasks(n) {
      if (!tasksTickRef.current) return;
      tasksTickRef.current.textContent = `+${n}`;
      tasksTickRef.current.classList.remove('is-firing');
      void tasksTickRef.current.offsetWidth;
      tasksTickRef.current.classList.add('is-firing');
    }

    function fireImpulse(fromX, fromY, toX, toY, options = {}) {
      const scene = sceneRef.current;
      if (!scene) return;
      const impulses = scene.querySelector('#alive-impulses');
      if (!impulses) return;

      const duration = options.duration || 900;
      const onArrive = options.onArrive;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'av-impulse');
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      glow.setAttribute('cx', fromX); glow.setAttribute('cy', fromY);
      glow.setAttribute('r', 6); glow.setAttribute('fill', 'rgba(233, 30, 132, 0.4)');
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', fromX); dot.setAttribute('cy', fromY);
      dot.setAttribute('r', 2.5); dot.setAttribute('fill', '#ffffff');
      dot.setAttribute('filter', 'url(#av-impulseGlow)');
      g.appendChild(glow);
      g.appendChild(dot);
      impulses.appendChild(g);

      const start = performance.now();
      function step(now) {
        const elapsed = now - start;
        const t = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const x = fromX + (toX - fromX) * eased;
        const y = fromY + (toY - fromY) * eased;
        glow.setAttribute('cx', x); glow.setAttribute('cy', y);
        dot.setAttribute('cx', x); dot.setAttribute('cy', y);
        if (t > 0.85) g.setAttribute('opacity', 1 - (t - 0.85) / 0.15);
        if (t < 1) requestAnimationFrame(step);
        else { g.remove(); if (onArrive) onArrive(); }
      }
      requestAnimationFrame(step);
    }

    function activateAgent(agentId) {
      const scene = sceneRef.current;
      if (!scene) return;
      const node = scene.querySelector(`.av-agent-node[data-agent="${agentId}"]`);
      if (!node) return;
      node.classList.add('is-active');
      const t = setTimeout(() => node.classList.remove('is-active'), 700);
      timers.push(t);
    }

    function applyEventMetrics(ev) {
      if (ev.cash > 0) {
        state.balance += ev.cash;
        popBalance(ev.cash);
      }
      state.plan = Math.min(99, state.plan + ev.plan);
      state.tasksToday += ev.tasks;
      popTasks(ev.tasks);
      if (state.plan >= 99) {
        const t = setTimeout(() => {
          state.plan = 14 + Math.random() * 8;
          state.tasksToday = 0;
          renderStats();
        }, 3000);
        timers.push(t);
      }
      renderStats();
    }

    function addTerminalLine(text, opts = {}) {
      const term = terminalRef.current;
      if (!term) return;
      const line = document.createElement('div');
      line.className = 'av-term-line';
      const prompt = opts.prompt !== false
        ? '<span class="av-term-prompt">› </span>'
        : '<span style="color: var(--ink-4)">  </span>';
      const colored = text
        .replace(/(→\s.*$)/g, '<span class="av-term-result">$1</span>')
        .replace(/\b([a-z_]+)(\.[a-z_]+)\b(?=\()/gi, '<span class="av-term-keyword">$1</span><span class="av-term-fn">$2</span>')
        .replace(/"([^"]*)"/g, '<span class="av-term-string">"$1"</span>')
        .replace(/\b(\d+)\b/g, '<span class="av-term-num">$1</span>');
      line.innerHTML = prompt + colored;
      term.appendChild(line);
      while (term.children.length > 6) term.firstChild.remove();
    }

    function showNextEvent() {
      if (!eventTextRef.current) return;
      eventTextRef.current.style.opacity = 0;
      const t = setTimeout(() => {
        let idx;
        do { idx = Math.floor(Math.random() * ANIM_EVENTS.length); }
        while (idx === lastEventIdx && ANIM_EVENTS.length > 1);
        lastEventIdx = idx;
        const ev = ANIM_EVENTS[idx];

        eventTextRef.current.textContent = ev.text;
        currentEventTime = 0;
        if (eventTimeRef.current) eventTimeRef.current.textContent = 'только что';
        eventTextRef.current.style.opacity = 1;

        const agent = getAgentById(ev.agent);
        if (agent) {
          const pos = getAgentPos(agent);
          fireImpulse(0, 0, pos.x, pos.y, {
            duration: 850,
            onArrive: () => {
              activateAgent(ev.agent);
              applyEventMetrics(ev);
              ev.code.forEach((line, i) => {
                const tt = setTimeout(() => addTerminalLine(line, { prompt: i === 0 }), i * 250);
                timers.push(tt);
              });
            },
          });
        }
      }, 200);
      timers.push(t);
    }

    function scheduleNextEvent(initialDelay) {
      const delay = initialDelay !== undefined ? initialDelay : 4500 + Math.random() * 2500;
      const t = setTimeout(() => {
        showNextEvent();
        scheduleNextEvent();
      }, delay);
      timers.push(t);
    }

    function fireRandomImpulse() {
      const agent = ANIM_AGENTS[Math.floor(Math.random() * ANIM_AGENTS.length)];
      const pos = getAgentPos(agent);
      const direction = Math.random();
      if (direction < 0.5) {
        fireImpulse(0, 0, pos.x, pos.y, {
          duration: 800 + Math.random() * 300,
          onArrive: () => activateAgent(agent.id),
        });
      } else if (direction < 0.8) {
        fireImpulse(pos.x, pos.y, 0, 0, { duration: 800 + Math.random() * 300 });
        activateAgent(agent.id);
      } else {
        const target = ANIM_AGENTS[Math.floor(Math.random() * ANIM_AGENTS.length)];
        if (target.id === agent.id) return;
        const tp = getAgentPos(target);
        fireImpulse(pos.x, pos.y, tp.x, tp.y, {
          duration: 700 + Math.random() * 300,
          onArrive: () => activateAgent(target.id),
        });
        activateAgent(agent.id);
      }
    }
    function scheduleRandomImpulse() {
      const t = setTimeout(() => {
        fireRandomImpulse();
        scheduleRandomImpulse();
      }, 1800 + Math.random() * 2000);
      timers.push(t);
    }

    function fireSyncEvent() {
      const shuffled = [...ANIM_AGENTS].sort(() => Math.random() - 0.5);
      const targets = shuffled.slice(0, 3 + Math.floor(Math.random() * 2));
      targets.forEach((agent, idx) => {
        const t = setTimeout(() => {
          const pos = getAgentPos(agent);
          fireImpulse(0, 0, pos.x, pos.y, {
            duration: 900,
            onArrive: () => activateAgent(agent.id),
          });
        }, idx * 80);
        timers.push(t);
      });
      addTerminalLine('orchestrator.broadcast({ scope: "all" })');
      const t2 = setTimeout(() => addTerminalLine(`→ ${targets.length} agents notified`, { prompt: false }), 350);
      timers.push(t2);
    }
    function scheduleNextSync() {
      const t = setTimeout(() => {
        fireSyncEvent();
        scheduleNextSync();
      }, 11000 + Math.random() * 5000);
      timers.push(t);
    }

    function bootTerminal() {
      const lines = [
        { text: 'alive.boot({ env: "production" })', opts: {} },
        { text: '→ 8 agents online', opts: { prompt: false } },
        { text: '→ heartbeat: 3.5s', opts: { prompt: false } },
        { text: 'orchestrator.start()', opts: {} },
        { text: '→ ready', opts: { prompt: false } },
      ];
      lines.forEach((l, i) => {
        const t = setTimeout(() => addTerminalLine(l.text, l.opts), i * 220);
        timers.push(t);
      });
    }

    // СТАРТ
    bootTerminal();

    // Стартовые микро-события
    const t1 = setTimeout(() => {
      state.balance += 45;
      state.tasksToday += 1;
      state.plan += 1.5;
      popBalance(45);
      popTasks(1);
      renderStats();
    }, 1500);
    timers.push(t1);

    const t2 = setTimeout(() => {
      state.tasksToday += 1;
      state.plan += 1.2;
      popTasks(1);
      renderStats();
    }, 3200);
    timers.push(t2);

    // Основные циклы
    const t3 = setTimeout(() => {
      scheduleNextEvent(1500);
      scheduleRandomImpulse();
      scheduleNextSync();
    }, 800);
    timers.push(t3);

    const timeInterval = setInterval(() => {
      currentEventTime += 1;
      if (!eventTimeRef.current) return;
      if (currentEventTime <= 1) eventTimeRef.current.textContent = 'только что';
      else if (currentEventTime < 60) eventTimeRef.current.textContent = `${currentEventTime} сек. назад`;
      else eventTimeRef.current.textContent = `${Math.floor(currentEventTime / 60)} мин. назад`;
    }, 1000);

    return () => {
      timers.forEach(t => clearTimeout(t));
      clearInterval(timeInterval);
    };
  }, []);

  // Размечаем статичные элементы JSX
  return (
    <div className="alive-anim">
      {/* ШАПКА С ОПИСАНИЕМ КОМАНДЫ */}
      <div className="av-team-head">
        <div className="av-team-head-main">
          <div className="av-team-name-row">
            <span className="av-team-kicker">Демонстрация · реальная команда</span>
            <h3 className="av-team-name">{TEAM_INFO.name}</h3>
          </div>
          <button
            className="av-team-toggle"
            onClick={() => setTeamInfoOpen(!teamInfoOpen)}
          >
            {teamInfoOpen ? 'Свернуть' : 'О команде'}
            <ChevronDown size={14} className={`av-team-chevron ${teamInfoOpen ? 'is-open' : ''}`} />
          </button>
        </div>
        {teamInfoOpen && (
          <div className="av-team-details">
            <p className="av-team-desc">{TEAM_INFO.description}</p>
            <div className="av-team-grid">
              <div className="av-team-cell">
                <div className="av-team-cell-label">Миссия</div>
                <div className="av-team-cell-value">{TEAM_INFO.mission}</div>
              </div>
              <div className="av-team-cell">
                <div className="av-team-cell-label">Идея</div>
                <div className="av-team-cell-value">{TEAM_INFO.idea}</div>
              </div>
              <div className="av-team-cell">
                <div className="av-team-cell-label">Цели</div>
                <ul className="av-team-goals">
                  {TEAM_INFO.goals.map((g, i) => <li key={i}>{g}</li>)}
                </ul>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="av-eyebrow-row">
        <span className="av-eyebrow">Прямо сейчас</span>
        <div className="av-online">
          <span className="av-online-dot" />
          <span>Система активна</span>
        </div>
      </div>

      <div className="av-stats">
        <div className="av-stat av-stat-balance">
          <span className="av-stat-label">Баланс</span>
          <span className="av-stat-value" ref={balanceRef}>$ 180</span>

              <stop offset="35%" stopColor="#E91E84" stopOpacity="0.85" />

                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="av-coreGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          {/* Связи от ядра к узлам */}
          {ANIM_AGENTS.map((a) => {
            const rad = (a.angle * Math.PI) / 180;
            const isCoreHovered = hoveredAgent === 'twin';
            const isMyAgentHovered = hoveredAgent === a.id;
            const isActive = isCoreHovered || isMyAgentHovered;
            return (
              <line key={`l-${a.id}`}
                x1={0} y1={0}
                x2={Math.cos(rad) * a.r} y2={Math.sin(rad) * a.r}
                stroke={isActive ? 'rgba(233, 30, 132, 0.55)' : 'rgba(255,255,255,0.07)'}
                strokeWidth={isActive ? 1.5 : 1}
                style={{ transition: 'stroke 0.3s, stroke-width 0.3s' }}
              />
            );
          })}

          {/* Кросс-связи */}
          {CROSS_LINKS.map(([from, to]) => {
            const af = ANIM_AGENTS.find(x => x.id === from);
            const at = ANIM_AGENTS.find(x => x.id === to);
            const r1 = (af.angle * Math.PI) / 180;
            const r2 = (at.angle * Math.PI) / 180;
            const isActive = hoveredAgent === from || hoveredAgent === to;
            return (
              <line key={`cl-${from}-${to}`}
                x1={Math.cos(r1) * af.r} y1={Math.sin(r1) * af.r}
                x2={Math.cos(r2) * at.r} y2={Math.sin(r2) * at.r}
                stroke={isActive ? 'rgba(233, 30, 132, 0.55)' : 'rgba(255,255,255,0.04)'}
                strokeWidth={isActive ? 1.5 : 1}
                style={{ transition: 'stroke 0.3s, stroke-width 0.3s' }}
              />
            );
          })}

          {/* Волны */}
          <circle className="av-wave av-wave-1" cx={0} cy={0} r={28} fill="none" stroke="rgba(233, 30, 132, 0.6)" strokeWidth={1} />
          <circle className="av-wave av-wave-2" cx={0} cy={0} r={28} fill="none" stroke="rgba(168, 51, 185, 0.5)" strokeWidth={1} />
          <circle className="av-wave av-wave-3" cx={0} cy={0} r={28} fill="none" stroke="rgba(107, 47, 181, 0.4)" strokeWidth={1} />

          {/* Импульсы (динамически вставляются) */}

          {/* Узлы-агенты */}
          {ANIM_AGENTS.map((a) => {
            const rad = (a.angle * Math.PI) / 180;
            const x = Math.cos(rad) * a.r;
            const y = Math.sin(rad) * a.r;
            const isHovered = hoveredAgent === a.id;
            const isSelected = selectedAgent?.id === a.id;
            const isConnected = connectedAgents.has(a.id);
            const isDimmed = hoveredAgent && !isHovered && !isConnected;
            return (
              <g
                key={`a-${a.id}`}
                className={`av-agent-node ${isHovered ? 'is-hover' : ''} ${isSelected ? 'is-selected' : ''} ${isDimmed ? 'is-dimmed' : ''}`}
                data-agent={a.id}

                style={{ cursor: 'pointer' }}

                {a.symbol === 'triangle' && <polygon points="0,-3 2.8,2 -2.8,2" fill="var(--ink-2)" />}
                {a.symbol === 'plus' && (
                  <g fill="var(--ink-2)">
                    <rect x={-0.7} y={-3} width={1.4} height={6} />

                <text className="av-agent-label" x={0} y={26}>{a.label}</text>

          {/* Ядро — Цифровой двойник, оркестратор */}
          <g

            onMouseEnter={() => setHoveredAgent('twin')}
            onMouseLeave={() => setHoveredAgent(null)}

            <g className="av-core-pulse">

            {/* Подпись ядра */}

          </g>
        </svg>
      </div>

      <div className="av-event-feed">

                            {renderAvatarSymbol(selectedAgent, 16)}

                            <span></span><span></span><span></span>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={i} className={`av-msg av-msg-${msg.from}`}>
                        {msg.from === 'agent' && (
                          <div className="av-msg-avatar">
                            {renderAvatarSymbol(selectedAgent, 16)}
                          </div>
                        )}
                        <div className="av-msg-bubble">{msg.text}</div>
                      </div>
                    );
                  })}
                </div>

                <div className="av-chat-suggestions">
                  <div className="av-chat-suggestions-label">
                    {chatMessages.length === 0 ? 'Начните с одного из вопросов:' : 'Ещё вопросы:'}

                  <div className="av-chat-suggestions-list">
                    {selectedAgent.chat.map((qa, idx) => {
                      const isUsed = usedQuestions.has(idx);
                      return (
                        <button
                          key={idx}
                          className={`av-chat-suggestion ${isUsed ? 'is-used' : ''}`}
                          onClick={() => sendQuestion(qa, idx)}

                    <div className="av-chat-end-hint">

                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          <div className="av-agent-card-hint">
            Это пример: полномочия и инструменты каждого агента полностью настраиваются под вас на этапе калибровки
          </div>
        </div>
      )}

      <div className="av-click-hint">
        <span className="av-click-hint-dot" />
        <span>Нажмите на любого агента или на центральное ядро — раскроется карточка с описанием и чатом</span>
      </div>
    </div>
  );
}

  return (
    <section className={`faq-section ${listOpen ? 'is-expanded' : ''}`}>
      <button
        className="faq-toggle"
        onClick={() => setListOpen(!listOpen)}
        aria-expanded={listOpen}
      >
        <div className="faq-toggle-text">
          <div className="faq-kicker">Частые вопросы</div>
          <div className="faq-toggle-title">
            {listOpen ? 'Что обычно спрашивают' : `Открыть список из ${FAQ_ITEMS.length} вопросов`}
          </div>
        </div>
        <span className="faq-toggle-chevron">
          {listOpen ? <ChevronDown size={20} /> : <ChevronRight size={20} />}

      </button>

        <div className="faq-list">
          {FAQ_ITEMS.map((item, idx) => {
            const isOpen = open === idx;
            return (
              <div key={idx} className={`faq-item ${isOpen ? 'is-open' : ''}`}>
                <button className="faq-q" onClick={() => setOpen(isOpen ? null : idx)}>
                  <span>{item.q}</span>

  );

function buildSubmissionText(selections, summaryFor, metrics, contact) {
  const lines = ['Заявка в Alive', '———', ''];
  lines.push('— КОНТАКТЫ —');
  lines.push(`Имя: ${contact.name}`);
  lines.push(`Telegram/телефон: ${contact.contact}`);
  if (contact.preferredTime) lines.push(`Удобное время: ${contact.preferredTime}`);
  if (contact.note) lines.push(`Комментарий: ${contact.note}`);
  lines.push('');
  lines.push('— КОНФИГУРАЦИЯ —');
  ALL_KEYS.forEach((key) => {
    const sec = SECTIONS[key];
    const summary = summaryFor(key) || '—';
    lines.push(`${sec.title}: ${summary}`);
  });
  lines.push('');
  lines.push('— РАСЧЁТЫ —');
  lines.push(`Стоимость в месяц: $${metrics.cost.toLocaleString('en-US')}`);
  lines.push(`Первый результат: ${formatFirstResult(metrics.firstDays)}`);
  lines.push(`Достижение целей: ${formatGoalTime(metrics.goalMonths)}`);
  return lines.join('\n');
}

function SubmissionModal({ selections, summaryFor, metrics, onClose }) {
  // step: 'contact' → 'review' → 'done'
  const [step, setStep] = useState('contact');
  const [contact, setContact] = useState({ name: '', contact: '', preferredTime: '', note: '' });
  const [sending, setSending] = useState(false);

  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);

  const contactValid = contact.name.trim().length >= 2 && contact.contact.trim().length >= 3;

  const handleSend = async () => {
    setSending(true);
    const text = buildSubmissionText(selections, summaryFor, metrics, contact);
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // буфер недоступен — всё равно открываем телеграм
    }
    window.open('https://t.me/Vladimir_Pop', '_blank', 'noopener,noreferrer');
    setStep('done');
    setSending(false);
  };

  // ============== STEP 1: КОНТАКТЫ ==============
  if (step === 'contact') {
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal modal-submission" onClick={(e) => e.stopPropagation()}>
          <button className="modal-close" onClick={onClose}><X size={16} /></button>
          <div className="modal-kicker">Шаг 1 из 2 — Контакты</div>
          <h2 className="modal-title">Как с вами связаться</h2>
          <p className="modal-lead">
            Чтобы запустить ваш AI-офис, нам нужен короткий созвон — обсудить детали и согласовать старт. Оставьте контакт, и мы напишем в течение 24 часов.
          </p>

          <div className="submission-form">
            <div className="form-field">
              <label className="form-label">Как к вам обращаться</label>
              <input
                type="text"
                className="form-input"
                placeholder="Имя"
                value={contact.name}
                onChange={(e) => setContact({ ...contact, name: e.target.value })}
                autoFocus
              />
            </div>
            <div className="form-field">
              <label className="form-label">Telegram или телефон</label>
              <input
                type="text"
                className="form-input"
                placeholder="@username или +7 999 123-45-67"
                value={contact.contact}
                onChange={(e) => setContact({ ...contact, contact: e.target.value })}
              />
            </div>
            <div className="form-field">
              <label className="form-label">Удобное время для звонка <span className="form-optional">(не обязательно)</span></label>
              <input
                type="text"
                className="form-input"
                placeholder="Например: будни после 18:00 МСК"
                value={contact.preferredTime}
                onChange={(e) => setContact({ ...contact, preferredTime: e.target.value })}
              />
            </div>
            <div className="form-field">
              <label className="form-label">Что важно сразу обсудить <span className="form-optional">(не обязательно)</span></label>
              <textarea
                className="form-input form-textarea"
                placeholder="Контекст, который поможет нам подготовиться к разговору"
                rows={3}
                value={contact.note}
                onChange={(e) => setContact({ ...contact, note: e.target.value })}
              />
            </div>
          </div>

          <div className="submission-actions">
            <button
              className={`cta-launch ${contactValid ? 'is-active' : 'is-dim'}`}
              disabled={!contactValid}
              onClick={() => setStep('review')}
            >
              <span>Дальше — проверить заявку</span>
              <ArrowRight size={16} />
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ============== STEP 2: ПРОВЕРКА И ОТПРАВКА ==============
  if (step === 'review') {
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal modal-submission" onClick={(e) => e.stopPropagation()}>
          <button className="modal-close" onClick={onClose}><X size={16} /></button>
          <div className="modal-kicker">Шаг 2 из 2 — Проверка</div>
          <h2 className="modal-title">Сводка вашей заявки</h2>
          <p className="modal-lead">
            Это то, что увидит команда Alive. Если всё верно — отправляйте. По кнопке откроется ваш Telegram с готовым сообщением, останется его отправить.
          </p>

          <div className="submission-summary">
            <div className="submission-row">
              <span className="submission-label">Контакт</span>
              <span className="submission-value">{contact.name} · {contact.contact}{contact.preferredTime ? ` · ${contact.preferredTime}` : ''}</span>
            </div>
            {ALL_KEYS.map((key) => {
              const sec = SECTIONS[key];
              return (
                <div key={key} className="submission-row">
                  <span className="submission-label">{sec.title}</span>
                  <span className="submission-value">{summaryFor(key) || '—'}</span>
                </div>
              );
            })}
          </div>

          <div className="submission-metrics">
            <div className="submission-metric">
              <span className="submission-metric-label">Стоимость в месяц</span>
              <span className="submission-metric-value">${metrics.cost.toLocaleString('en-US')}</span>
            </div>
            <div className="submission-metric">
              <span className="submission-metric-label">Первый результат</span>
              <span className="submission-metric-value">{formatFirstResult(metrics.firstDays)}</span>
            </div>
            <div className="submission-metric">
              <span className="submission-metric-label">Достижение целей</span>
              <span className="submission-metric-value">{formatGoalTime(metrics.goalMonths)}</span>
            </div>
          </div>

          <div className="submission-actions submission-actions-row">
            <button className="cta-secondary" onClick={() => setStep('contact')}>
              <ArrowLeft size={14} /><span>Назад</span>
            </button>
            <button className="cta-launch is-active" onClick={handleSend} disabled={sending}>
              <Send size={16} /><span>Отправить в Telegram</span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ============== STEP 3: БЛАГОДАРНОСТЬ + NEXT STEPS ==============
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal modal-submission modal-done" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><X size={16} /></button>

        <div className="done-icon"><Check size={28} strokeWidth={2.5} /></div>

        <div className="modal-kicker">Заявка отправлена</div>
        <h2 className="modal-title">Спасибо, {contact.name}</h2>
        <p className="modal-lead">
          Текст заявки скопирован в буфер и открыт в Telegram. Если сообщение не вставилось автоматически — вставьте вручную (Cmd/Ctrl + V) и отправьте команде Alive.
        </p>

        <div className="next-steps">
          <div className="next-steps-title">Что будет дальше</div>
          <ol className="next-steps-list">
            <li>
              <span className="step-num">1</span>
              <div>
                <div className="step-title">Мы свяжемся с вами в течение 24 часов</div>
                <div className="step-desc">Уточнит детали и предложит время для созвона</div>
              </div>
            </li>
            <li>
              <span className="step-num">2</span>
              <div>
                <div className="step-title">Созвон 30 минут</div>
                <div className="step-desc">Обсудим вашу ситуацию, согласуем доступы и приоритеты</div>
              </div>
            </li>
            <li>
              <span className="step-num">3</span>
              <div>
                <div className="step-title">Настройка Принципала</div>
                <div className="step-desc">Загружаем голос, образ, ценности, красные линии — Двойник обучается на вас</div>
              </div>
            </li>
            <li>
              <span className="step-num">4</span>
              <div>
                <div className="step-title">Запуск первых агентов</div>
                <div className="step-desc">Подключаем доступы, разворачиваем команду, она начинает работать</div>
              </div>
            </li>
            <li>
              <span className="step-num">5</span>
              <div>
                <div className="step-title">Аудит и калибровка</div>
                <div className="step-desc">Через неделю — отчёт и тонкая настройка под ваш стиль</div>
              </div>
            </li>
          </ol>
        </div>

        <div className="submission-actions">
          <button className="cta-launch is-active" onClick={onClose}>
            <span>Готово</span>
          </button>
        </div>
      </div>
    </div>
  );
}

function EasyModeModal({ text, setText, sent, onSubmit, onClose }) {
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal modal-easy" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><X size={16} /></button>
        <div className="modal-kicker">Сделайте всё за меня</div>
        <h2 className="modal-title">Расскажите своими словами</h2>
        <p className="modal-lead">
          Не нужно знать термины и думать о структуре. Пара предложений — этого достаточно. Alive разберётся со всем сама.
        </p>
        <textarea
          value={text} onChange={(e) => setText(e.target.value)}
          placeholder={'Например: «Хочу освободить себя от рутины своего интернет-магазина — зарабатывать столько же или больше, но иметь больше времени на семью»\n\nИли: «Мечтаю стать известным блогером в нише психологии — аудитория 100к+ и стабильный доход»'}
          className="easy-textarea" rows={7} disabled={sent}
        />
        <div className="modal-foot">
          {sent ? (
            <div className="easy-sent">
              <Check size={16} />
              <span>Принято. Alive обрабатывает запрос — следите за дашбордом.</span>
            </div>
          ) : (
            <button className="cta-launch is-active" onClick={onSubmit} disabled={text.trim().length < 5}>
              <Sparkles size={16} /><span>Запустить Alive с этим</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

.av-scene {
  width: 100%;
  aspect-ratio: 1.5 / 1;
  position: relative;
  margin: 4px 0 14px;
}
.av-scene svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

.av-core-pulse {
  animation: av-coreHeartbeat 3.5s ease-in-out infinite;
  transform-origin: center;
  transform-box: fill-box;
}
@keyframes av-coreHeartbeat {
  0%, 100% { transform: scale(1); }
  8% { transform: scale(1.06); }
  16% { transform: scale(1); }
  24% { transform: scale(1.03); }
  32% { transform: scale(1); }
}

.av-wave { transform-origin: center; transform-box: fill-box; }
@keyframes av-wavePulse {
  0% { r: 28; opacity: 0.5; stroke-width: 1.5; }
  100% { r: 130; opacity: 0; stroke-width: 0.5; }
}
.av-wave-1 { animation: av-wavePulse 3.5s ease-out infinite; }
.av-wave-2 { animation: av-wavePulse 3.5s ease-out 1.2s infinite; }
.av-wave-3 { animation: av-wavePulse 3.5s ease-out 2.3s infinite; }

.av-agent-circle {
  transition: filter 0.4s ease, transform 0.4s ease;
  transform-origin: center;
  transform-box: fill-box;
}
.av-agent-node.is-active .av-agent-circle {
  filter: drop-shadow(0 0 14px rgba(233, 30, 132, 0.9));
  transform: scale(1.18);
}
.av-agent-label {
  font-family: var(--font);
  font-size: 9.5px;
  font-weight: 500;
  fill: var(--ink-3);
  letter-spacing: 0;
  text-anchor: middle;
  transition: fill 0.4s ease;
}
.av-agent-node.is-active .av-agent-label {
  fill: var(--ink);
}

/* === ЦЕНТРАЛЬНОЕ ЯДРО (Digital Twin) === */
.av-core-group {
  transition: filter 0.3s ease;
}
.av-core-label {
  font-family: var(--font);
  font-size: 10px;
  font-weight: 600;
  fill: var(--ink-2);
  text-anchor: middle;
  letter-spacing: 0;
  transition: fill 0.3s ease;
}
.av-core-group.is-hover .av-core-label,
.av-core-group.is-selected .av-core-label {
  fill: var(--ink);
}
.av-core-group.is-hover .av-core-pulse {
  filter: drop-shadow(0 0 14px rgba(233, 30, 132, 0.5));
}
.av-core-group.is-selected .av-core-pulse {
  filter: drop-shadow(0 0 18px rgba(233, 30, 132, 0.7));
}

.av-impulse { pointer-events: none; }

.av-event-feed {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  min-height: 44px;
  overflow: hidden;
  margin-bottom: 14px;
}
.av-event-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-pink);
  box-shadow: 0 0 8px var(--brand-pink);
  flex-shrink: 0;
  animation: av-eventPulse 1.4s ease-in-out infinite;
}
@keyframes av-eventPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.av-event-text {
  flex: 1;
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -0.005em;
  line-height: 1.4;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: opacity 0.4s ease;
}
.av-event-time {
  font-size: 12px;
  color: var(--ink-3);
  flex-shrink: 0;
  letter-spacing: -0.005em;
  font-feature-settings: 'tnum';
}

.av-terminal {
  background: #0a0a0b;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.av-term-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.av-term-dots {
  display: flex;
  gap: 5px;
}
.av-term-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.av-term-dots span:nth-child(1) { background: #ff5f57; }
.av-term-dots span:nth-child(2) { background: #febc2e; }
.av-term-dots span:nth-child(3) { background: #28c840; }
.av-term-title {
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--ink-3);
  margin-left: 6px;
}
.av-term-tag {
  margin-left: auto;
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 10px;
  color: #4ade80;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.av-term-tag-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
  animation: av-onlinePulse 1.5s ease-in-out infinite;
}
.av-term-body {
  padding: 12px 14px;
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-2);
  height: 132px;
  overflow: hidden;
  position: relative;
  letter-spacing: -0.005em;
}
.av-term-line {
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: av-lineIn 0.35s var(--ease);
}
@keyframes av-lineIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.av-term-prompt { color: var(--brand-pink); }
.av-term-keyword { color: #c084fc; }
.av-term-string { color: #86efac; }
.av-term-num { color: #fda4af; }
.av-term-fn { color: #93c5fd; }
.av-term-result { color: #4ade80; }

/* === ШАПКА КОМАНДЫ === */
.av-team-head {
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.av-team-head-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.av-team-name-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.av-team-kicker {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.av-team-name {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0;
  line-height: 1.2;
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.av-team-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.av-team-toggle:hover {
  color: var(--ink);
  border-color: var(--ink-2);
  background: var(--surface-2);
}
.av-team-chevron {
  transition: transform 0.3s var(--ease);
}
.av-team-chevron.is-open { transform: rotate(180deg); }

.av-team-details {
  margin-top: 14px;
  animation: av-lineIn 0.3s var(--ease);
}
.av-team-desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.55;
  letter-spacing: -0.005em;
  margin: 0 0 14px;
}
.av-team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.av-team-cell {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
}
.av-team-cell-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.av-team-cell-value {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.4;
  letter-spacing: -0.005em;
}
.av-team-goals {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.av-team-goals li {
  font-size: 12.5px;
  color: var(--ink);
  line-height: 1.4;
  letter-spacing: -0.005em;
  position: relative;
  padding-left: 10px;
}
.av-team-goals li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--ink-3);
}

/* === HOVER-СОСТОЯНИЯ УЗЛОВ === */
.av-agent-node {
  transition: opacity 0.3s ease;
}
.av-agent-node.is-dimmed {
  opacity: 0.35;
}
.av-agent-node.is-hover .av-agent-circle {
  filter: drop-shadow(0 0 16px rgba(233, 30, 132, 0.9));
  transform: scale(1.22);
}
.av-agent-node.is-hover .av-agent-label {
  fill: var(--ink);
  font-weight: 600;
}
.av-agent-node.is-selected .av-agent-circle {
  filter: drop-shadow(0 0 18px rgba(233, 30, 132, 1));
  transform: scale(1.25);
  stroke: var(--brand-pink) !important;
  stroke-width: 2 !important;
}
.av-agent-node.is-selected .av-agent-label {
  fill: var(--ink);
  font-weight: 600;
}

/* === INLINE-КАРТОЧКА АГЕНТА === */
.av-agent-card {
  margin-top: 14px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  overflow: hidden;
  animation: av-cardSlideIn 0.4s var(--ease);
  position: relative;
}
.av-agent-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--brand-gradient);
  opacity: 0.7;
}
@keyframes av-cardSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.av-agent-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line);
}
.av-agent-card-title-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}
.av-agent-card-symbol {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  flex-shrink: 0;
}
.av-agent-card-name {
  margin: 0 0 2px;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.025em;
}
.av-agent-card-role {
  font-size: 12.5px;
  color: var(--ink-2);
  letter-spacing: -0.005em;
}
.av-agent-card-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  margin-left: 12px;
}
.av-agent-card-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 8px #4ade80;
  animation: av-onlinePulse 2s ease-in-out infinite;
}
.av-agent-card-close {
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  cursor: pointer;
  flex-shrink: 0;
  margin-left: 12px;
  transition: all 0.2s;
}
.av-agent-card-close:hover {
  color: var(--ink);
  border-color: var(--ink-2);
  background: var(--surface-2);
}

.av-agent-card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 16px 20px 14px;
}
.av-agent-card-section-full {
  grid-column: 1 / -1;
}
.av-agent-card-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.av-agent-card-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.av-agent-card-task {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.5;
  letter-spacing: -0.005em;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.av-agent-card-task-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-pink);
  box-shadow: 0 0 8px var(--brand-pink);
  flex-shrink: 0;
  margin-top: 6px;
  animation: av-eventPulse 1.4s ease-in-out infinite;
}
.av-agent-card-today {
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.025em;
  font-feature-settings: 'tnum';
  line-height: 1;
}
.av-agent-card-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.av-agent-card-tool {
  display: inline-flex;
  align-items: center;
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: -0.005em;
}

.av-agent-card-policies {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.av-policy-block {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.av-policy-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: -0.005em;
}
.av-policy-allow .av-policy-head { color: #4ade80; }
.av-policy-ask .av-policy-head { color: #fbbf24; }
.av-policy-deny .av-policy-head { color: #f87171; }
.av-policy-block ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.av-policy-block li {
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.4;
  letter-spacing: -0.005em;
}

/* === ЧАТ С АГЕНТОМ === */
.av-chat-section {
  padding: 0 20px 14px;
  border-top: 1px solid var(--line);
}

.av-chat-open-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  margin-top: 14px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  color: var(--ink);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.av-chat-open-btn:hover {
  background: var(--surface-2);
  border-color: rgba(168, 51, 185, 0.3);

.av-chat-open-icon {

  border-radius: 50%;

.av-chat {
  margin-top: 14px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  overflow: hidden;
  animation: av-cardSlideIn 0.3s var(--ease);
}

.av-chat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.av-chat-head-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.av-chat-head-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
  margin-top: 2px;
}
.av-chat-head-status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
  animation: av-onlinePulse 2s ease-in-out infinite;
}
.av-chat-head-actions {
  display: flex;
  gap: 6px;
}
.av-chat-reset, .av-chat-close {
  width: 28px;
  height: 28px;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--ink-3);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s;
}
.av-chat-reset:hover, .av-chat-close:hover {
  color: var(--ink);
  border-color: var(--ink-2);
  background: var(--bg);

.av-chat-body {
  padding: 16px;
  min-height: 80px;
  max-height: 320px;
  overflow-y: auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;

  scrollbar-color: var(--line-strong) transparent;
}
.av-chat-body::-webkit-scrollbar { width: 6px; }
.av-chat-body::-webkit-scrollbar-track { background: transparent; }
.av-chat-body::-webkit-scrollbar-thumb {

  border-radius: 999px;

.av-chat-empty {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.av-chat-empty-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-pink);
  box-shadow: 0 0 10px var(--brand-pink);

}
.av-chat-empty-text {
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: -0.005em;

.av-msg {

  align-items: flex-end;

@keyframes av-msgIn {

  to { opacity: 1; transform: translateY(0); }

.av-msg-user {

}
.av-msg-agent {

}

.av-msg-avatar {
  width: 26px;
  height: 26px;

  place-items: center;
  flex-shrink: 0;
  border: 1px solid var(--line-strong);
}

.av-msg-bubble {
  padding: 10px 14px;

  line-height: 1.5;
  letter-spacing: -0.005em;

.av-msg-user .av-msg-bubble {
  background: var(--brand-gradient);
  color: var(--white);
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 16px rgba(168, 51, 185, 0.25);
}
.av-msg-agent .av-msg-bubble {
  background: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}

.av-typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 14px 16px;
}
.av-typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
  animation: av-typingDot 1.4s ease-in-out infinite;
}
.av-typing span:nth-child(2) { animation-delay: 0.2s; }
.av-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes av-typingDot {
