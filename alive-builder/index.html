  40% { opacity: 1; transform: translateY(-3px); }
}

.av-chat-suggestions {
  padding: 12px 16px 14px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.av-chat-suggestions-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.av-chat-suggestions-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.av-chat-suggestion {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: all 0.2s;
}
.av-chat-suggestion:hover:not(:disabled) {
  background: var(--surface);
  border-color: rgba(168, 51, 185, 0.3);
  box-shadow: 0 0 0 1px rgba(168, 51, 185, 0.12);
}
.av-chat-suggestion svg {
  color: var(--ink-3);
  flex-shrink: 0;
  transition: color 0.2s, transform 0.2s;
}
.av-chat-suggestion:hover:not(:disabled) svg {
  color: var(--brand-pink);
  transform: translateX(2px);
}
.av-chat-suggestion.is-used {
  background: transparent;
  color: var(--ink-3);
  border-color: var(--line);
  cursor: default;
  opacity: 0.55;
}
.av-chat-suggestion.is-used svg {
  color: #4ade80;
}
.av-chat-end-hint {
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
  text-align: center;
}

.av-agent-card-hint {
  padding: 10px 20px 14px;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
  border-top: 1px solid var(--line);
  background: var(--bg);
}

/* Подсказка про клик когда никто не выбран */
.av-click-hint {
  margin-top: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--bg);
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
}
.av-click-hint-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-pink);
  box-shadow: 0 0 8px var(--brand-pink);
  animation: av-eventPulse 1.4s ease-in-out infinite;
}

/* === ВИДЕО-ЗАГЛУШКА === */
.video-teaser {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 18px 14px 14px;
  margin: 24px 0 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--ink);
  text-decoration: none;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s var(--ease);
}
.video-teaser:hover {
  background: var(--surface-2);
  border-color: rgba(168, 51, 185, 0.3);
  box-shadow: 0 0 0 1px rgba(168, 51, 185, 0.15), 0 12px 32px rgba(0, 0, 0, 0.3);
  transform: translateY(-1px);
}
.video-teaser-thumb {
  position: relative;
  flex-shrink: 0;
  width: 96px;
  height: 96px;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, #1a0f2e 0%, #2d1648 50%, #4a1a3e 100%);
}
.video-teaser-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.7;
  transition: opacity 0.25s, transform 0.4s var(--ease);
}
.video-teaser:hover .video-teaser-img {
  opacity: 0.85;
  transform: scale(1.05);
}
.video-teaser-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(168, 51, 185, 0.25) 0%, rgba(0, 0, 0, 0.5) 100%);
  pointer-events: none;
}
.video-teaser-play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.95);
  color: #0a0a0b;
  display: grid;
  place-items: center;
  padding-left: 3px;
  box-shadow: 0 4px 20px rgba(168, 51, 185, 0.5);
  transition: all 0.25s var(--ease);
}
.video-teaser:hover .video-teaser-play {
  background: var(--white);
  box-shadow: 0 6px 24px rgba(233, 30, 132, 0.7);
  transform: translate(-50%, -50%) scale(1.08);
}
.video-teaser-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.video-teaser-kicker {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.video-teaser-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
  line-height: 1.3;
}
.video-teaser-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
  margin-top: 2px;
}
.video-teaser-dot { color: var(--ink-4); }
.video-teaser-arrow {
  flex-shrink: 0;
  color: var(--ink-3);
  transition: color 0.2s, transform 0.25s var(--ease);
}
.video-teaser:hover .video-teaser-arrow {
  color: var(--ink);
  transform: translate(2px, -2px);
}

/* === TRUST STRIP (узкая строка с лого клиентов) === */
.trust-strip {
  margin: 32px 0;
  padding: 8px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  opacity: 0.45;
  transition: opacity 0.3s;
}
.trust-strip:hover { opacity: 0.75; }
.trust-strip-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.trust-strip-logos {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.trust-strip-logo {
  font-family: var(--font);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.025em;
  color: var(--ink-2);
}
.trust-strip-dot {
  color: var(--ink-4);
  font-size: 14px;
}

.hero-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.progress-text {
  font-size: 14px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
}
.progress-text strong {
  color: var(--ink);
  font-weight: 600;
  padding: 0 4px;
}

.cta-launch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.2s;
}
.cta-launch.is-active {
  background: var(--ink);
  color: var(--bg);
  transition: all 0.25s var(--ease);
}
.cta-launch.is-active:hover:not(:disabled) {
  background: var(--white);
}
.cta-launch.is-dim {
  background: transparent;
  color: var(--ink-3);
  border-color: var(--line-strong);
  cursor: not-allowed;
}

/* === FAQ === */
.faq-section {
  margin-top: 32px;
  padding-top: 0;
  border-top: none;
}
.faq-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.faq-toggle:hover {
  background: var(--surface-2);
  border-color: var(--line-strong);
}
.faq-toggle-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 0;
}
.faq-toggle-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
  line-height: 1.3;
}
.faq-toggle-chevron {
  flex-shrink: 0;
  color: var(--ink-3);
  display: flex;
  transition: color 0.2s;
}
.faq-toggle:hover .faq-toggle-chevron { color: var(--ink); }
.faq-section.is-expanded .faq-toggle {
  background: var(--surface-2);
  border-color: var(--line-strong);
  border-radius: 12px 12px 0 0;
  border-bottom: none;
}
.faq-kicker {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.faq-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0 0;
  animation: fadeUp 0.3s var(--ease);
}
.faq-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.faq-item:hover { border-color: var(--line-strong); }
.faq-item.is-open { border-color: var(--line-strong); background: var(--surface-2); }
.faq-q {
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 22px;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.01em;
  text-align: left;
  cursor: pointer;
  line-height: 1.4;
  transition: background 0.2s;
}
.faq-q:hover { background: rgba(255,255,255,0.02); }
.faq-chevron {
  color: var(--ink-3);
  flex-shrink: 0;
  margin-top: 2px;
  transition: color 0.2s;
}
.faq-q:hover .faq-chevron { color: var(--ink); }
.faq-a {
  padding: 0 22px 20px;
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.6;
  letter-spacing: -0.005em;
  animation: fadeUp 0.25s var(--ease);
}

/* === FOOTER === */
.alive-footer {
  margin-top: 40px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}
.footer-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.footer-link:hover {
  background: var(--surface-2);
  border-color: var(--line-stronger);
}
.footer-link svg {
  color: var(--ink-3);
  transition: color 0.2s;
  flex-shrink: 0;
}
.footer-link:hover svg {
  color: var(--ink);
}
.footer-link-brand {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-strong);
  font-weight: 500;
  transition: all 0.25s var(--ease);
}
.footer-link-brand:hover {
  background: var(--surface-2);
  border-color: rgba(168, 51, 185, 0.3);
  box-shadow: 0 0 0 1px rgba(168, 51, 185, 0.15), 0 12px 32px rgba(0, 0, 0, 0.3);
  transform: translateY(-1px);
}
.footer-link-brand svg {
  color: var(--ink-3);
  transition: color 0.2s;
}
.footer-link-brand:hover svg {
  color: var(--ink);
}
.footer-textlink {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  text-decoration: none;
  transition: color 0.2s;
}
.footer-textlink:hover { color: var(--ink); }
.footer-textlink svg { flex-shrink: 0; }

/* === MODE TOGGLE === */
.mode-toggle {
  margin-bottom: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.mode-toggle:hover { border-color: var(--line-strong); }
.mode-toggle.is-open { border-color: var(--line-strong); }
.mode-toggle-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 28px 32px;
  background: transparent;
  border: none;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s;
}
.mode-toggle-header:hover { background: rgba(255, 255, 255, 0.02); }
.mode-toggle-head-text { flex: 1; min-width: 0; }
.mode-toggle-kicker {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 8px;
  letter-spacing: -0.005em;
}
.mode-toggle-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1.15;
}
.mode-toggle-meta {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-shrink: 0;
}
.mode-toggle-count {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  font-feature-settings: 'tnum';
  letter-spacing: -0.01em;
}
.mode-toggle-chevron {
  color: var(--ink-3);
  display: flex;
  transition: color 0.2s;
}
.mode-toggle-header:hover .mode-toggle-chevron { color: var(--ink); }
.mode-toggle-body {
  padding: 8px 32px 32px;
  border-top: 1px solid var(--line);
  animation: fadeUp 0.3s var(--ease);
}

/* === INNER SECTION === */
.inner-section { margin-top: 28px; }
.inner-section:first-child { margin-top: 16px; }
.inner-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.inner-section-head-text {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  min-width: 0;
}
.inner-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin: 0;
  letter-spacing: -0.015em;
}
.inner-section-subline {
  font-size: 12px;
  font-weight: 400;
  color: var(--ink-3);
  letter-spacing: -0.005em;
}
.inner-section-count {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  font-feature-settings: 'tnum';
  letter-spacing: -0.01em;
  flex-shrink: 0;
}
.inner-section-body { }

/* === SCENARIOS === */
.scenarios-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.scenario-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all 0.2s;
}
.scenario-card:hover {
  background: var(--surface-2);
  border-color: var(--line-strong);
}
.scenario-icon { color: var(--ink-3); margin-bottom: 4px; }
.scenario-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.018em;
  line-height: 1.3;
}
.scenario-desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
  flex: 1;
}
.scenario-cta {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  margin-top: 4px;
  letter-spacing: -0.005em;
}

/* === CARDS GRID === */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.dash-card {
  position: relative;
  text-align: left;
  cursor: pointer;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 20px 20px;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  min-height: 200px;
  overflow: hidden;
  font-family: inherit;
  color: var(--ink);
}
.dash-card:hover {
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.dash-card.is-selected {
  border-color: var(--line-stronger);
  background: var(--surface-2);
}
.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-3);
  margin-bottom: 16px;
}
.card-glyph { color: var(--ink-3); }
.dash-card.is-selected .card-glyph { color: var(--ink-2); }
.card-num {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  font-feature-settings: 'tnum';
  letter-spacing: -0.005em;
}
.card-info {
  margin-left: auto;
  color: var(--ink-3);
  cursor: pointer;
  padding: 4px;
  display: flex;
  transition: color 0.2s;
  border-radius: 4px;
}
.card-info:hover { color: var(--ink); }
.card-body { flex: 1; }
.card-title {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin: 0 0 6px;
  color: var(--ink);
}
.card-brief {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
  margin: 0;
}
.card-foot {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.card-cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  transition: color 0.2s;
  letter-spacing: -0.005em;
}
.dash-card:hover .card-cta { color: var(--ink); }
.card-summary {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card-summary-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
}
.card-summary-value {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.45;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-hover {
  position: absolute;
  inset: 0;
  background: var(--surface-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
}
.dash-card:hover .card-hover { opacity: 1; }
.card-hover-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 10px;
  flex-shrink: 0;
}
.card-hover-text {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.5;
  margin-bottom: 12px;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
  min-height: 0;
}
.card-hover-cta {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  flex-shrink: 0;
}

/* === EASY BANNER === */
.easy-banner {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 22px 26px;
  border-radius: 14px;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
  font-family: inherit;
  transition: all 0.2s;
  margin-top: 28px;
}
.easy-banner:hover {
  background: var(--surface-2);
  border-color: var(--line-strong);
}
.easy-banner-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink);
  display: grid;
  place-items: center;
}
.easy-banner:hover .easy-banner-icon { background: var(--surface-3); }
.easy-banner-text { flex: 1; min-width: 0; }
.easy-banner-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  line-height: 1.3;
  letter-spacing: -0.018em;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
}
.easy-banner-sub {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
}
.easy-banner-arrow {
  color: var(--ink-3);
  transition: color 0.2s, transform 0.2s;
  flex-shrink: 0;
}
.easy-banner:hover .easy-banner-arrow {
  color: var(--ink);
  transform: translateX(2px);
}

/* === SELECTION VIEW === */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 24px;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--ink); }

.sel-head { margin-bottom: 32px; max-width: 680px; }
.sel-kicker {
